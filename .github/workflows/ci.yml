name: CI

on:
  # Tags run this through the release workflow instead.
  push:
    branches:
      - master
  pull_request:
  # hassfest and the HACS check move whether or not this repository does.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

# Renovate opens a PR when any of these has a new release, and these jobs run on it.
env:
  # renovate: datasource=pypi depName=pytest-homeassistant-custom-component
  HA_STABLE_PLUGIN_VERSION: "0.13.375"
  # renovate: datasource=pypi depName=homeassistant
  HA_BETA_VERSION: "2026.11.0b1"
  # The integration runs the CLI its SDK names, so this only watches for releases.
  # renovate: datasource=npm depName=@anthropic-ai/claude-code
  CLAUDE_CLI_VERSION: "2.1.316"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration

  stable:
    name: Tests on the latest Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        # Pinning the plugin stops the resolver from quietly walking back to an
        # old Home Assistant if it ever needs a newer Python than this. The
        # requirements install under Home Assistant's constraints, as they do for users.
        run: |
          uv venv --python 3.14 .venv
          uv pip install "pytest-homeassistant-custom-component==$HA_STABLE_PLUGIN_VERSION" ruff
          constraints=$(.venv/bin/python -c "import homeassistant, os; print(os.path.dirname(homeassistant.__file__))")/package_constraints.txt
          uv pip install -c "$constraints" $(jq -r '.requirements[]' custom_components/claude/manifest.json) hassil home-assistant-intents gazetteer-matcher PyTurboJPEG
      - name: CLI releases have the builds the integration downloads
        run: |
          sdk_cli=$(.venv/bin/python -c "from claude_agent_sdk._cli_version import __cli_version__ as v; print(v)")
          for version in "$sdk_cli" "$CLAUDE_CLI_VERSION"; do
            curl -fsS "https://downloads.claude.ai/claude-code-releases/$version/manifest.json" \
              | jq -e '.platforms | has("linux-arm64-musl") and has("linux-x64-musl")'
          done
      - name: Lint
        run: .venv/bin/ruff check custom_components tests
      - name: Test
        run: .venv/bin/python -m pytest tests -q

  beta:
    # pytest-homeassistant-custom-component only follows stable releases, so
    # against a beta this can only catch what fails at import time.
    name: Imports on the newest Home Assistant, beta included
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.14 .venv
          uv pip install "homeassistant==$HA_BETA_VERSION"
          constraints=$(.venv/bin/python -c "import homeassistant, os; print(os.path.dirname(homeassistant.__file__))")/package_constraints.txt
          uv pip install -c "$constraints" $(jq -r '.requirements[]' custom_components/claude/manifest.json) hassil home-assistant-intents gazetteer-matcher PyTurboJPEG
      - name: Import every module
        run: PYTHONPATH=. .venv/bin/python tests/import_all.py
